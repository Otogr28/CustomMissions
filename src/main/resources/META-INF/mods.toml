modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}" #optional
# Both-side mod: the server runs the mission engine and the client renders quest markers/overlays, so
# the jar must be present on both. Every player ships the same jar via the modpack, so versions always
# match; IGNORE_SERVER_VERSION avoids hard version-gating joins.
displayTest="IGNORE_SERVER_VERSION"
description='''${mod_description}'''

[[dependencies.${mod_id}]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="${forge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# All integration mods are OPTIONAL and accessed defensively (ModList.isLoaded guards + command bridges,
# no compile-time coupling). Each is loaded AFTER us so our reward/objective bridges see registered content.

# JourneyMap: client renders an optional real map waypoint for reach_location objectives; without it the
# in-house S2C marker (compass + distance) still works.
[[dependencies.${mod_id}]]
    modId="journeymap"
    mandatory=false
    versionRange="[5.10,)"
    ordering="AFTER"
    side="BOTH"

# EasyNPC: talk_to_npc / deliver_item_to_npc objectives detect interactions with easy_npc:* entities.
[[dependencies.${mod_id}]]
    modId="easy_npc"
    mandatory=false
    versionRange="[6.0,)"
    ordering="AFTER"
    side="BOTH"

# StoryKit: the `cutscene` reward fires a /story play sequence on complete.
[[dependencies.${mod_id}]]
    modId="storykit"
    mandatory=false
    versionRange="[0.1,)"
    ordering="AFTER"
    side="BOTH"

# Realm Gates: the `unlock` reward opens a gate (/realmgates unlock <player> <dim>).
[[dependencies.${mod_id}]]
    modId="realmgates"
    mandatory=false
    versionRange="[0.1,)"
    ordering="AFTER"
    side="BOTH"

# Custom Companions: the `companion` reward grants a companion pictograph.
[[dependencies.${mod_id}]]
    modId="customcompanions"
    mandatory=false
    versionRange="[0.1,)"
    ordering="AFTER"
    side="BOTH"
