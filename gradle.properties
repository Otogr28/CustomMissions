# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.4.0
forge_version_range=[47,)
loader_version_range=[47,)
# Official field/method names from Mojang mapping files
mapping_channel=official
mapping_version=1.20.1


## Mod Properties

# Must be lowercase, regex [a-z][a-z0-9_]{1,63}; must match the @Mod constant.
mod_id=custommissions
mod_name=CustomMissions
mod_license=MIT
mod_version=0.1.12
# Base package used for the mod sources.
mod_group_id=com.summerbuddies.custommissions
mod_authors=otonielgrang
mod_description=AI-driven mission system: a hot-reloadable JSON mission language (daily, primary, secondary) whose objectives subscribe to live server events (kills, pickups, NPC talks, dimension entry, advancements, blocks) and custom signals from KubeJS/EasyNPC/other mods, with per-player progress, a server-wide lore stage, command/cutscene/unlock rewards, and on-screen quest markers. Daily missions are authored by an external AI brain via a file contract.
